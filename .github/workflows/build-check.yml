# 2026-09-05 repo 重建(切斷 fork 網路)後,dispatch-only workflow 需要一次 push 才會重新註冊。
name: Build Check

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # 🔴 resx 的「鍵存在但值為空」是崩潰級缺陷,不是風格問題:
      #    ResourceManager 回 "" 而**不會** fallback → ImGui 拿到零長度 span →
      #    fixed 取指標為 null → igFindRenderedTextEnd 從位址 0 掃 → C0000005。
      #    「鍵不存在」反而安全(會正常退回中性資源)。
      #    上游 crowdin 的 "New translations *.resx" 合併會把這種地雷帶回來,
      #    所以擋在建置之前。腳本純標準函式庫、自帶校準閘門(G1~G7)。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check resx empty values
        shell: pwsh
        run: python .github/scripts/check_resx_empty.py
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # 10.x:子模組 WrathCombo.API 的 LangVersion 是 14(上游用了 C# 14 的 extension 區塊
          # 與 field 關鍵字),必須用 .NET 10 SDK 才編得動。目標框架仍是 net9 / API13,不變。
          dotnet-version: 10.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          $pinUrl = 'https://github.com/ffxiv-tc-port/Dalamud/releases/download/dalamud-pin-v13.0.0.17/dalamud-api13-net9.zip'
          Invoke-WebRequest -Uri $pinUrl -OutFile dalamud-pinned.zip
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath dalamud-pinned.zip).Hash
          if ($sha -ne '1481704F4DACBE96070F7B306FF1CE4BD77DB69C19CD74969FE296643E49EB5B') { throw "pinned Dalamud SHA256 mismatch: $sha" }
          Expand-Archive -Force dalamud-pinned.zip "$env:RUNNER_TEMP\dalamud-pinned\"
      - name: Build with dotnet
        run: dotnet build --configuration Release AutoDuty/AutoDuty.csproj -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\"


